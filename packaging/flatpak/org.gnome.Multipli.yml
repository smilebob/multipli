app-id: org.gnome.Multipli
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: multipli

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio

modules:
  - name: multipli
    buildsystem: simple
    build-commands:
      # Installer les fichiers d'application
      - install -d /app/lib/multipli/multipli
      - install -d /app/lib/multipli/locales
      - install -d /app/bin
      - install -d /app/share/applications
      - install -d /app/share/icons/hicolor/scalable/apps
      - install -d /app/share/metainfo

      - cp main.py /app/lib/multipli/
      - cp -r multipli/* /app/lib/multipli/multipli/
      - cp -r locales/* /app/lib/multipli/locales/

      # Script lanceur
      - |
        cat << 'EOF' > /app/bin/multipli
        #!/bin/sh
        export PYTHONPATH="/app/lib/multipli:${PYTHONPATH}"
        exec python3 /app/lib/multipli/main.py "$@"
        EOF
      - chmod +x /app/bin/multipli

      # Metainfo, desktop et icône
      - install -Dm644 data/org.gnome.Multipli.desktop /app/share/applications/org.gnome.Multipli.desktop
      - install -Dm644 data/icons/org.gnome.Multipli.svg /app/share/icons/hicolor/scalable/apps/org.gnome.Multipli.svg
      - install -Dm644 data/org.gnome.Multipli.metainfo.xml /app/share/metainfo/org.gnome.Multipli.metainfo.xml
    sources:
      - type: dir
        path: ../..
